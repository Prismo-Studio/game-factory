name: promote

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repo du jeu (owner/name), vide = tous'
        required: false
      dry_run:
        type: boolean
        default: false

jobs:
  promote:
    uses: ./.github/workflows/_pipeline.yml
    with:
      pipeline: promote
      repo: ${{ inputs.repo || '' }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      GF_GITHUB_TOKEN: ${{ secrets.GF_GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
