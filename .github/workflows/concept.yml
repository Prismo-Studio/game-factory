name: concept

on:
  schedule:
    - cron: '0 9 * * 1'   # un concept par semaine, le lundi ; un humain trie
  workflow_dispatch:
    inputs:
      theme:
        description: 'Theme impose (optionnel)'
        required: false
      dry_run:
        type: boolean
        default: false

jobs:
  concept:
    uses: ./.github/workflows/_pipeline.yml
    with:
      pipeline: concept
      dry_run: ${{ inputs.dry_run || false }}
      extra: ${{ inputs.theme && format('--theme "{0}"', inputs.theme) || '' }}
    secrets:
      GF_GITHUB_TOKEN: ${{ secrets.GF_GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
