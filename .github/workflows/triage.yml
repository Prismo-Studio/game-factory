name: triage

on:
  schedule:
    - cron: '*/10 * * * *'   # filet de securite ; la cadence reelle vient du chainage (finalize → workflow_dispatch)
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repo cible (owner/name), vide = scan de tous les jeux'
        required: false
      issue:
        description: 'Numero d issue force (ignore les filtres)'
        required: false
      dry_run:
        description: 'Ni push, ni PR, ni ecriture GitHub'
        type: boolean
        default: false

jobs:
  triage:
    uses: ./.github/workflows/_pipeline.yml
    with:
      pipeline: triage
      repo: ${{ inputs.repo || '' }}
      issue: ${{ inputs.issue || '' }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      GF_GITHUB_TOKEN: ${{ secrets.GF_GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
