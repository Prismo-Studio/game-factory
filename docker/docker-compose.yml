services:
    runner: &runner
        build:
            context: ./runner
            args:
                GODOT_VERSION: ${GODOT_VERSION:-4.7.2}
        image: game-factory-runner:latest
        restart: always
        init: true
        env_file: .env
        environment: &runner_env
            GF_RUNNER_URL: ${GF_RUNNER_URL:-https://github.com/Prismo-Studio}
            GF_RUNNER_LABELS: gf
            GF_RUNNER_NAME: ${GF_RUNNER_NAME:-gf-local}
            GF_OLLAMA_URL: http://ollama:11434
            # Bibliotheque d assets locale (packs achetes/CC0) : niveau 1 de la cascade,
            # avant l API Poly Pizza et le placeholder. Voir docker/ASSETS.md.
            GF_ASSET_LIBRARY: /assets-library
        # adb vers Waydroid (sur l hote, port 5555) ou un telephone en TCP : renseigner GF_ADB_HOST dans .env.
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - ${GF_ASSET_LIBRARY_HOST:-../../assets-library}:/assets-library:ro
            - runner-work:/home/runner/actions-runner/_work
            - runner-config:/home/runner/runner-config
            - claude-config:/home/runner/.claude
            - godot-cache:/home/runner/.local/share/godot
            - gradle-cache:/home/runner/.gradle
        mem_limit: 6g
        cpus: 4
        security_opt:
            - no-new-privileges:true
        stop_grace_period: 5m
        logging:
            driver: json-file
            options:
                max-size: 50m
                max-file: "3"

    # Deuxieme runner (32 Go de RAM ou plus) : dev + ci, ou dev + review, en parallele.
    # Identite et _work separes ; login Claude, cache Godot et Gradle partages.
    runner-2:
        <<: *runner
        environment:
            <<: *runner_env
            GF_RUNNER_NAME: ${GF_RUNNER_NAME:-gf-local}-2
        volumes:
            - ${GF_ASSET_LIBRARY_HOST:-../../assets-library}:/assets-library:ro
            - runner-work-2:/home/runner/actions-runner/_work
            - runner-config-2:/home/runner/runner-config
            - claude-config:/home/runner/.claude
            - godot-cache:/home/runner/.local/share/godot
            - gradle-cache:/home/runner/.gradle


    # Battement de coeur : reveille les pipelines toutes les 10 min. Les crons GitHub Actions
    # sautent des executions sur un depot prive peu actif ; cette boucle tourne sur la machine
    # qui heberge deja les runners, donc elle est fiable tant que Docker tourne.
    heartbeat:
        image: node:22-alpine
        restart: always
        env_file: .env
        environment:
            GF_ORG: Prismo-Studio
            GF_HEARTBEAT_EVERY_S: ${GF_HEARTBEAT_EVERY_S:-600}
        working_dir: /factory
        volumes:
            - ../:/factory:ro
        command: ["node", "orchestrator/heartbeat.mjs"]
        mem_limit: 256m

    # Indexation de la bibliotheque : a relancer apres chaque pack ajoute/retire.
    #   docker compose run --rm assets-index
    # Monte en ecriture car le script ecrit index.json a la racine de la bibliotheque.
    assets-index:
        image: node:22-alpine
        profiles: ["tools"]
        environment:
            GF_ASSET_LIBRARY: /assets-library
        working_dir: /factory
        volumes:
            - ../:/factory:ro
            - ${GF_ASSET_LIBRARY_HOST:-../../assets-library}:/assets-library
        # Conversion .gltf -> .glb autonome, puis indexation. @gltf-transform est installe
        # dans le conteneur jetable : /factory est monte en lecture seule.
        command:
            - sh
            - -c
            - >
                npm install -g --silent @gltf-transform/core@4 &&
                NODE_PATH=$$(npm root -g) node orchestrator/assets-convert.mjs &&
                node orchestrator/assets-index.mjs
        mem_limit: 1g

    ollama:
        image: ollama/ollama:latest
        restart: always
        volumes:
            - ollama:/root/.ollama
        # Modele tire une fois : docker compose exec ollama ollama pull qwen2.5:14b
        mem_limit: 12g

volumes:
    runner-work:
    runner-config:
    runner-work-2:
    runner-config-2:
    claude-config:
    godot-cache:
    gradle-cache:
    ollama:
