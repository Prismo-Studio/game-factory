services:
    runner: &runner
        build:
            context: ./runner
            args:
                GODOT_VERSION: ${GODOT_VERSION:-4.7.2}
        image: game-factory-runner:latest
        restart: always
        init: true
        env_file: .env
        environment: &runner_env
            GF_RUNNER_URL: ${GF_RUNNER_URL:-https://github.com/Prismo-Studio}
            GF_RUNNER_LABELS: gf
            GF_RUNNER_NAME: ${GF_RUNNER_NAME:-gf-local}
            GF_OLLAMA_URL: http://ollama:11434
        # adb vers Waydroid (sur l hote, port 5555) ou un telephone en TCP : renseigner GF_ADB_HOST dans .env.
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - runner-work:/home/runner/actions-runner/_work
            - runner-config:/home/runner/runner-config
            - claude-config:/home/runner/.claude
            - godot-cache:/home/runner/.local/share/godot
            - gradle-cache:/home/runner/.gradle
        mem_limit: 6g
        cpus: 4
        security_opt:
            - no-new-privileges:true
        stop_grace_period: 5m
        logging:
            driver: json-file
            options:
                max-size: 50m
                max-file: "3"

    # Deuxieme runner (32 Go de RAM ou plus) : dev + ci, ou dev + review, en parallele.
    # Identite et _work separes ; login Claude, cache Godot et Gradle partages.
    runner-2:
        <<: *runner
        environment:
            <<: *runner_env
            GF_RUNNER_NAME: ${GF_RUNNER_NAME:-gf-local}-2
        volumes:
            - runner-work-2:/home/runner/actions-runner/_work
            - runner-config-2:/home/runner/runner-config
            - claude-config:/home/runner/.claude
            - godot-cache:/home/runner/.local/share/godot
            - gradle-cache:/home/runner/.gradle

    ollama:
        image: ollama/ollama:latest
        restart: always
        volumes:
            - ollama:/root/.ollama
        # Modele tire une fois : docker compose exec ollama ollama pull qwen2.5:14b
        mem_limit: 12g

volumes:
    runner-work:
    runner-config:
    runner-work-2:
    runner-config-2:
    claude-config:
    godot-cache:
    gradle-cache:
    ollama:
